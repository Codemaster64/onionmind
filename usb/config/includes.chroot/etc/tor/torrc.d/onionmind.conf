# Onionmind tor: client-only, keep nothing on "disk" (there is no disk - the
# overlay is RAM, this just keeps it from trying).
SocksPort 9050 IsolateSOCKSAuth

# To hide even THAT you use Tor from the local network, add bridges from
# https://bridges.torproject.org and restart tor (see usb/README.md):
#   ClientTransportPlugin obfs4 exec /usr/bin/obfs4proxy
#   UseBridges 1
#   Bridge obfs4 <bridge line>
