#!/usr/sbin/nft -f
# Fail closed. After this loads, the only ways off the box are:
#   - tor (the debian-tor user) - that's the design
#   - DHCP (an IP address, no name resolution)
#   - loopback (the model server)
# DNS is blocked for everyone including root: tor doesn't need it (socks5h
# resolves remotely, directory authority IPs are hard-coded), which is the
# point - a misbehaving process has nowhere to leak to. Verified behaviour,
# not aspiration: onionmind.py itself refuses to search unless the circuit
# checks out, so the network layer and the app agree on failing closed.
flush ruleset

table inet onionmind {
	chain input {
		type filter hook input priority filter; policy drop;
		iifname "lo" accept
		ct state established,related accept
		udp sport { 67, 547 } udp dport { 68, 546 } accept
		# IPv6 needs neighbour discovery to work AT ALL - without these, the
		# DHCPv6 rules below are dead code and the box is IPv4-only by accident
		# rather than by decision. Link-local only; nothing routable gets in.
		icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 saddr fe80::/10 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy drop;
		oifname "lo" accept
		ct state established,related accept
		# 547, not 546: 546 is the CLIENT port, so a DHCPv6 solicit (546 -> 547)
		# was being dropped on the way out while the input rule correctly expected
		# the reply from 547. IPv4 DHCP is 68 -> 67.
		udp dport { 67, 547 } accept
		icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert } ip6 daddr { fe80::/10, ff02::/16 } accept
		meta skuid "debian-tor" accept
	}
}
