[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onionmind-desktop"
version = "1.4.0"
description = "A private, local-first coding workbench powered by Ollama and DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ollama", "deepseek", "tor", "coding-agent", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "PySide6-Essentials>=6.11,<6.12",
    "requests>=2.32,<3",
    "PySocks>=1.7,<2",
]

[project.optional-dependencies]
desktop-build = [
    "Nuitka>=4.1,<5",
    "ordered-set>=4.1,<5",
    "zstandard>=0.23,<1",
]

[project.urls]
Homepage = "https://github.com/Codemaster64/onionmind"
Repository = "https://github.com/Codemaster64/onionmind"

[tool.setuptools]
include-package-data = false
py-modules = ["onionmind", "onionmind_desktop", "onionmind_desktop_core"]
