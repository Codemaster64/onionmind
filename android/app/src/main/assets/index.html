<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onionmind</title>
<style>
  :root { --purple: #7D4698; --dim: #9c7bb0; --bg: #0e0b12; --card: #17121d; --line: #2a2133; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: #e8e2ee; font: 16px/1.5 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
           border-bottom: 1px solid var(--line); }
  header svg { flex: none; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  #dots { margin-left: auto; display: flex; gap: 6px; font-size: 11px; color: #888; }
  .dot { padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); }
  .dot.on { color: #9ef0b0; border-color: #2c5e3c; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
         word-break: break-word; }
  .you { align-self: flex-end; background: var(--purple); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line);
         border-bottom-left-radius: 4px; }
  .bot small { display: block; color: var(--dim); font-size: 11px; margin-top: 6px; }
  #form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
          border-top: 1px solid var(--line); }
  #q { flex: 1; background: var(--card); border: 1px solid var(--line); color: inherit;
       border-radius: 12px; padding: 11px 14px; font: inherit; outline: none; }
  button { background: var(--purple); color: #fff; border: 0; border-radius: 12px;
           padding: 11px 18px; font: inherit; font-weight: 600; }
  button:disabled { opacity: .4; }
  #setup { margin: auto; max-width: 340px; text-align: center; padding: 24px; }
  #setup .ring { margin: 0 auto 18px; width: 84px; height: 84px; }
  #setup p { color: #b9aec4; font-size: 14px; margin: 8px 0 18px; }
  #device-note { color: #9ef0b0; font-size: 12px; margin: -8px 0 14px; }
  #model-list { display: grid; gap: 10px; text-align: left; }
  .model-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .model-card.recommended { border-color: #9ef0b0; box-shadow: 0 0 0 1px #2c5e3c inset; }
  .model-head { display: flex; align-items: baseline; gap: 8px; }
  .model-head strong { font-size: 14px; }
  .model-head span { color: #9ef0b0; font-size: 11px; margin-left: auto; }
  .model-meta { color: #b9aec4; font-size: 12px; margin: 4px 0 9px; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 14px 0; }
  .bar i { display: block; height: 100%; background: var(--purple); width: 0%; transition: width .5s; }
  #busy { text-align: center; color: var(--dim); font-size: 13px; padding: 6px; display: none; }
  .row { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<header>
  <svg width="26" height="26" viewBox="0 0 128 128" fill="none" stroke="#7D4698" stroke-width="9" stroke-linecap="round">
    <circle cx="64" cy="64" r="52" stroke-dasharray="290 36" transform="rotate(-104 64 64)" opacity=".4"/>
    <circle cx="64" cy="64" r="28" stroke-dasharray="156 20" transform="rotate(40 64 64)"/>
    <circle cx="64" cy="64" r="5" fill="#7D4698" stroke="none"/>
  </svg>
  <h1>Onionmind</h1>
  <div id="dots">
    <span class="dot" id="d-tor">tor</span><span class="dot" id="d-model">model</span>
  </div>
</header>

<div id="setup" hidden>
  <div class="ring">
    <svg viewBox="0 0 128 128" fill="none" stroke="#7D4698" stroke-width="7" stroke-linecap="round">
      <circle cx="64" cy="64" r="52" stroke-dasharray="290 36" transform="rotate(-104 64 64)" opacity=".35"/>
      <circle cx="64" cy="64" r="40" stroke-dasharray="223 28" transform="rotate(-32 64 64)" opacity=".55"/>
      <circle cx="64" cy="64" r="28" stroke-dasharray="156 20" transform="rotate(40 64 64)" opacity=".78"/>
      <circle cx="64" cy="64" r="16" stroke-dasharray="89 11" transform="rotate(112 64 64)"/>
      <circle cx="64" cy="64" r="6" fill="#7D4698" stroke="none"/>
    </svg>
  </div>
  <p id="setup-text"></p>
  <div id="device-note"></div>
  <div class="bar"><i id="prog"></i></div>
  <div id="model-list"></div>
</div>

<div id="chat"></div>
<div id="busy">thinking + searching over tor…</div>
<form id="form">
  <input id="q" placeholder="Ask anything…" autocomplete="off">
  <button id="send">Send</button>
</form>

<script>
let history = [], status = {model:'none'}, ready = false;
const $ = id => document.getElementById(id);

async function poll() {
  try { status = await (await fetch('/api/status')).json(); } catch {}
  $('d-tor').classList.toggle('on', !!status.tor);
  $('d-model').classList.toggle('on', status.model !== 'none' && !status.downloading);
  const setup = $('setup'), chat = $('chat'), form = $('form');
  if (status.model === 'none' && !status.downloading) {
    setup.hidden = false; chat.style.display = form.style.display = 'none'; ready = false;
    $('setup-text').textContent = 'Download the model? Everything stays on this phone.';
    $('prog').style.width = '0%';
    renderModelPicker();
  } else if (status.downloading) {
    setup.hidden = false; chat.style.display = form.style.display = 'none'; ready = false;
    $('setup-text').textContent = 'Downloading the ' + status.model.toUpperCase() +
      ' model — resumable, leave the app open.';
    $('prog').style.width = Math.round(status.progress * 100) + '%';
    $('model-list').innerHTML = '';
  } else {
    setup.hidden = true; chat.style.display = form.style.display = '';
    if (!ready) { add('bot', 'Ready. Tor ' + (status.tor ? 'is up' : 'is still building circuits — ' +
      'searches wait for it, chat does not') + '. Ask anything.'); ready = true; }
  }
}
setInterval(poll, 2000); poll();

function recommendedTier() {
  const ram = Number(status.ramMb || 0);
  if (ram >= 11000) return '9b';
  if (ram >= 7000) return '4b';
  return 'lfm';
}

function renderModelPicker() {
  const ram = Number(status.ramMb || 0);
  const storage = Number(status.freeStorageMb || 0);
  const rec = recommendedTier();
  $('device-note').textContent = ram
    ? ('Detected: ' + Math.round(ram / 1024 * 10) / 10 + ' GB RAM · ' +
       Math.round(storage / 102.4) / 10 + ' GB free storage. Recommended: ' + rec.toUpperCase())
    : 'Scanning this phone for the best match…';
  const models = [
    {tier:'lfm', name:'LFM2.5 Heretic', params:'2.6B parameters', size:'~1.7 GB download', specs:'Recommended: 4 GB RAM · 3 GB free storage', note:'Fastest; best for small phones, tools and quick chat'},
    {tier:'4b', name:'Qwen3.5 Heretic', params:'4B parameters', size:'~2.7 GB download', specs:'Recommended: 8 GB RAM · 4 GB free storage', note:'Balanced quality and speed'},
    {tier:'9b', name:'Qwen3.5 Heretic', params:'9B parameters', size:'~5.6 GB download', specs:'Recommended: 12 GB RAM · 7 GB free storage', note:'Best answers; slower and heavier'}
  ];
  $('model-list').innerHTML = models.map(m =>
    '<div class="model-card ' + (m.tier === rec ? 'recommended' : '') + '">' +
      '<div class="model-head"><strong>' + m.name + '</strong>' +
      (m.tier === rec ? '<span>RECOMMENDED</span>' : '') + '</div>' +
      '<div class="model-meta">' + m.params + ' · ' + m.size + '<br>' + m.specs + '<br>' + m.note + '</div>' +
      '<button onclick="install(\'' + m.tier + '\')">Download ' + m.tier.toUpperCase() + '</button>' +
    '</div>'
  ).join('');
}

async function install(tier) {
  try {
    const r = await fetch('/api/install', {method:'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body:'tier='+encodeURIComponent(tier)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } catch (err) {
    $('setup-text').textContent = 'Could not start the download. Please try again.';
  }
}

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (cls === 'bot') {
    const b = document.createElement('small');
    b.textContent = 'copy';
    b.style.cursor = 'pointer';
    b.onclick = () => { navigator.clipboard.writeText(text); b.textContent = 'copied'; };
    d.appendChild(document.createElement('br')); d.appendChild(b);
  }
  $('chat').appendChild(d);
  $('chat').scrollTop = 1e9;
  return d;
}

$('form').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  $('q').value = ''; add('you', q);
  history.push({role:'user', content:q});
  $('busy').style.display = 'block';
  try {
    const response = await fetch('/api/chat', {method:'POST',
      body: 'messages=' + encodeURIComponent(JSON.stringify(history))});
    const raw = await response.text();
    let r;
    try { r = JSON.parse(raw); }
    catch (_) { throw new Error(raw.slice(0, 240) || 'invalid server response'); }
    if (!response.ok || r.error) throw new Error(r.error || 'chat request failed');
    add('bot', r.answer || '(empty response)');
    history = r.messages || history;
  } catch (err) { add('bot', '(error: ' + err + ')'); }
  $('busy').style.display = 'none';
};
</script>
</body>
</html>
