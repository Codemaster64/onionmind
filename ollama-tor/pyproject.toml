[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-tor"
version = "0.1.0"
description = "Fail-closed Tor routing for Ollama Launch integrations and other local-model agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ollama", "tor", "privacy", "proxy", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = [
    "build>=1.3,<2",
    "pytest>=8.4,<9",
]

[project.scripts]
ollama-tor = "ollama_tor.cli:main"

[project.urls]
Homepage = "https://github.com/Codemaster64/onionmind/tree/main/ollama-tor"
Repository = "https://github.com/Codemaster64/onionmind"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ollama_tor = ["shims/*.py", "shims/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
