name: desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same suites on the other platforms the installers support, headless
  # (Qt offscreen). Kept in this workflow: the privacy contracts allow no
  # new workflow files.
  posix-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the app's dependencies
        run: python -m pip install "requests>=2.32,<3" "PySocks>=1.7,<2" "PySide6-Essentials>=6.11,<6.12" "cryptography>=42,<51" "textual>=1,<9"

      - name: Generated payloads are current
        run: python build.py --check

      - name: Static checks (pyflakes rules through flake8, which honours noqa)
        # CI-only tool; nothing is added to the app. onionmind_desktop.py
        # re-exports its parts' names for older callers, so unused imports
        # there are intended.
        run: |
          python -m pip install "flake8>=7,<8"
          python -m flake8 --select=F --per-file-ignores="onionmind_desktop.py:F401" \
            --exclude=android,.git,__pycache__ .

      - name: unittest suites
        shell: bash
        run: |
          failed=()
          for suite in tests/test_coding_agent.py tests/test_privacy_contracts.py \
                       tests/test_desktop_core.py tests/test_installer_contracts.py \
                       tests/test_release_version_contracts.py tests/test_desktop_ui.py \
                       tests/test_desktop_thinking_ui.py tests/test_desktop_tor_ui.py \
                       tests/test_desktop_v2_ui.py tests/test_e2e_smoke.py tests/test_vault.py; do
            echo "::group::$suite"
            python -m unittest "$suite" || failed+=("$suite")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "Failed: ${failed[*]}"; exit 1; fi

      - name: Script suites (parser, backends, terminal UI)
        shell: bash
        run: |
          python tests/test_parser.py
          python tests/test_backends.py
          python tests/test_tui.py

      - name: The universal installer's sh half parses and dry-runs
        shell: bash
        run: |
          sh -n onionmind-install.cmd
          printf 'q\n' | sh onionmind-install.cmd --dry-run

      - name: The updater installs into a fresh folder, audits clean, then finds it current
        # A real run, not a text check: it downloads the sources of this
        # commit (main's would lack files a pull request adds), builds the
        # desktop runtime and writes the launchers.
        shell: bash
        env:
          ONIONMIND_UPDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dir="$RUNNER_TEMP/onionmind-update"
          bash update-onionmind.sh --install-dir "$dir" --allow-network --yes
          bash update-onionmind.sh --install-dir "$dir" --audit | tee audit.txt
          if grep -E '^  (onionmind|dsh-|desktop runtime)' audit.txt | grep -E 'MISSING|OUTDATED'; then exit 1; fi
          bash update-onionmind.sh --install-dir "$dir" --allow-network --yes | tee again.txt
          grep -q 'skipping pip' again.txt
          head -3 /usr/local/bin/onionmind

  windows:
    name: Windows standalone bundle
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Check installer payloads
        shell: powershell
        run: python build.py --check

      - name: Run core unit tests
        shell: powershell
        run: |
          python -m pip install "requests>=2.32,<3" "PySocks>=1.7,<2" "PySide6-Essentials>=6.11,<6.12" "cryptography>=42,<51"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # PowerShell takes a step's result from its LAST command only, so a
          # failing suite earlier in a plain list passed silently. Run every
          # suite (one failure should not hide the next) and fail on any.
          # The UI suites set QT_QPA_PLATFORM=offscreen themselves, so they run
          # headless on the runner.
          $suites = @(
            "tests/test_parser.py",
            "tests/test_backends.py",
            "tests/test_coding_agent.py",
            "tests/test_privacy_contracts.py",
            "tests/test_desktop_core.py",
            "tests/test_installer_contracts.py",
            "tests/test_release_version_contracts.py",
            "tests/test_desktop_ui.py",
            "tests/test_desktop_thinking_ui.py",
            "tests/test_desktop_tor_ui.py",
            "tests/test_desktop_v2_ui.py",
            "tests/test_e2e_smoke.py",
            "tests/test_vault.py"
          )
          $failed = @()
          foreach ($suite in $suites) {
            Write-Host "== $suite"
            python $suite
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
          }
          if ($failed.Count -gt 0) {
            Write-Host "Failed suites: $($failed -join ', ')"
            exit 1
          }

      - name: The updater installs into a fresh folder and audits clean
        shell: powershell
        env:
          ONIONMIND_UPDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'onionmind-update'
          .\update-onionmind.ps1 -InstallDir $dir -AllowDirectNetwork -Yes
          .\update-onionmind.ps1 -InstallDir $dir -Audit
          if ($LASTEXITCODE -ne 0) { Write-Host "audit exit $LASTEXITCODE"; exit 1 }
          .\update-onionmind.ps1 -InstallDir $dir -AllowDirectNetwork -Yes

      - name: The universal installer's Windows half dry-runs
        shell: cmd
        run: echo q| onionmind-install.cmd --dry-run

      - name: Validate desktop build inputs
        shell: powershell
        run: .\tools\build-desktop.ps1 -Check -PythonExecutable python

      - name: Build Onionmind.exe
        shell: powershell
        # The runner venv starts empty, so the consent-gated dependency repair
        # must be allowed; -Yes skips the interactive prompt headless.
        run: .\tools\build-desktop.ps1 -PythonExecutable python -AllowDirectNetwork -Yes

      - name: Verify standalone bundle
        shell: powershell
        run: |
          $Bundle = "dist\onionmind_desktop.dist"
          $Expected = @(
            "Onionmind.exe",
            "dsh-onionmind-tor-search.js",
            "dsh-onionmind-tor.patch.yml",
            "onionmind.ico",
            "logo.svg",
            "logo-small.svg",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            ".onionmind-source-revision"
          )
          foreach ($Name in $Expected) {
            if (-not (Test-Path -LiteralPath (Join-Path $Bundle $Name) -PathType Leaf)) {
              throw "Standalone bundle is missing $Name"
            }
          }
          # Encryption at rest needs cryptography's compiled core in the bundle.
          $Rust = Get-ChildItem -LiteralPath $Bundle -Recurse -Filter "_rust*.pyd" |
            Where-Object { $_.FullName -like "*cryptography*" }
          if (-not $Rust) { throw "Standalone bundle is missing cryptography's native module" }
          $Revision = (Get-Content -LiteralPath (Join-Path $Bundle ".onionmind-source-revision") -Raw).Trim()
          if ($Revision -ne "${{ github.sha }}") {
            throw "Bundle revision $Revision does not match the built commit ${{ github.sha }}"
          }

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: Onionmind-Windows-x64
          path: dist/onionmind_desktop.dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  # The in-app updater refuses api.github.com (hostile to shared Tor exit
  # addresses) and reads a plain release asset instead. Every push to main
  # republishes the rolling desktop-latest release: the zip carries the bundle,
  # the JSON manifest carries the revision, size, and SHA-256 the app verifies
  # before staging anything.
  release:
    name: rolling desktop-latest release
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write       # keyless Sigstore signing for the provenance attestation
      attestations: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_ASSET: Onionmind-Windows-x64.zip
      MANIFEST_ASSET: onionmind-update.json
    steps:
      # The installer scripts are attached below, so this job needs the tree as
      # well as the build artifact.
      - uses: actions/checkout@v4

      - name: Download the built bundle
        uses: actions/download-artifact@v4
        with:
          name: Onionmind-Windows-x64
          path: bundle

      - name: Pack bundle and write the update manifest
        run: |
          set -euo pipefail
          test -f "bundle/Onionmind.exe"
          # upload-artifact drops dotfiles at the artifact root, so the bundle's
          # revision marker never survives the trip between jobs. The Windows
          # job already verified the built marker equals this sha; write it back
          # before zipping so installed copies carry their update identity.
          revision="${{ github.sha }}"
          printf '%s\n' "$revision" > bundle/.onionmind-source-revision
          (cd bundle && zip -qr "../${BUNDLE_ASSET}" .)
          size="$(stat -c%s "${BUNDLE_ASSET}")"
          sha256="$(sha256sum "${BUNDLE_ASSET}" | cut -d' ' -f1)"
          cat > "${MANIFEST_ASSET}" <<EOF
          {
            "product": "onionmind-desktop",
            "platform": "windows-x64",
            "revision": "${revision}",
            "version": "1.4.0",
            "asset": "${BUNDLE_ASSET}",
            "asset_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest/${BUNDLE_ASSET}",
            "size": ${size},
            "sha256": "${sha256}"
          }
          EOF
          cat "${MANIFEST_ASSET}"

      - name: Checksum every release asset
        run: |
          set -euo pipefail
          # onionmind-install.cmd checks what it downloads against this file.
          # The web installers fetch the program files below from this release
          # and check each against a SHA-256 build.py pinned inside them.
          sha256sum "${BUNDLE_ASSET}" "${MANIFEST_ASSET}" onionmind-install.cmd \
            onionmind-setup.cmd install-onionmind.sh install-onionmind-android.sh \
            onionmind-setup-web.cmd install-onionmind-web.sh install-onionmind-android-web.sh \
            matchstick.cmd matchstick.sh \
            onionmind.py onionmind_desktop*.py logo.svg onionmind.ico > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: SHA256SUMS

      - name: Publish the rolling release
        run: |
          set -euo pipefail
          gh release delete desktop-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create desktop-latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Onionmind desktop (rolling)" \
            --notes "Rolling build of main, republished on every push. The installers are attached here because a raw link renders in the browser instead of downloading; release assets are served as attachments. Installed copies check this release over Tor; the manifest pins the revision, size, and SHA-256 of the zip. SHA256SUMS covers every asset and carries a GitHub build-provenance attestation (gh attestation verify SHA256SUMS --repo Codemaster64/onionmind)." \
            "${BUNDLE_ASSET}" \
            "${MANIFEST_ASSET}" \
            onionmind-install.cmd \
            onionmind-setup.cmd \
            install-onionmind.sh \
            install-onionmind-android.sh \
            onionmind-setup-web.cmd \
            install-onionmind-web.sh \
            install-onionmind-android-web.sh \
            matchstick.cmd \
            matchstick.sh \
            onionmind.py onionmind_desktop*.py logo.svg onionmind.ico \
            SHA256SUMS
