name: usb kit
# Runs on every push now that the repo is public (Actions minutes are free for
# public repos). The visibility guard still skips everything instantly if the
# repo is ever private again - no billed failures, just silence.
on:
  push:
  workflow_dispatch:

jobs:
  validate:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: syntax (shell + python)
        run: |
          bash -n usb/build.sh matchstick.sh install-onionmind.sh \
                  install-onionmind-android.sh update-onionmind.sh android/itest.sh
          # The validators carry no shebang; CI runs all but the clock one with sh.
          bash -n usb/tests/validate-clock.sh
          for t in usb/tests/validate-*.sh; do
            [ "$t" = usb/tests/validate-clock.sh ] || sh -n "$t"
          done
          # Select by SHEBANG and pipe through xargs. Two reasons the old
          # `-name 'onionmind*' ... -exec sh -n {} \;` form could never fail:
          # it also matched the systemd .service units, and find reports its
          # OWN status, not the status of -exec. It was reporting those units
          # as syntax errors and exiting 0 anyway.
          find usb/config -type f -exec grep -lZ -m1 -e '^#!.*sh' {} + \
            | xargs -0 -r -n1 sh -n
          python -m py_compile onionmind.py build.py

      - name: installers carry onionmind.py verbatim
        # build.py is the whole defence against onionmind.py drifting between the
        # repo copy and its three embedded copies. Unenforced, it defends nothing.
        run: python build.py --check

      - name: python tests
        run: |
          pip install --quiet requests
          python tests/test_parser.py
          python tests/test_backends.py

      - name: kotlin core tests (offline)
        # The android/ logic is a port of onionmind.py and had already drifted
        # twice unnoticed, because the only Kotlin tests needed a live tor and
        # were excluded by default. These run against the SAME fixture as the
        # python suite. NetTest stays excluded - see core/build.gradle.kts.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/android gradle:8-jdk17             gradle --no-daemon --console=plain :core:test

      - name: live-build flags + package names (trixie)
        run: docker run --rm -v "$PWD/usb/tests:/t" debian:trixie sh /t/validate-live-build.sh

      - name: ollama bake + blob GC + read-only store
        run: |
          mkdir -p usb/cache
          curl -L --fail -o usb/cache/ollama-linux-amd64.tar.zst \
            https://ollama.com/download/ollama-linux-amd64.tar.zst
          curl -L --fail -o usb/cache/Qwen3-0.6B.Q4_K_M.gguf \
            "https://huggingface.co/mradermacher/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B.Q4_K_M.gguf"
          docker run --rm --privileged \
            -v "$PWD/usb/cache:/cache" -v "$PWD/usb/tests:/t" \
            debian:trixie sh /t/validate-ollama-bake.sh

      - name: privacy fixes (mac check, ram scrub, bridges)
        run: |
          docker run --rm --privileged \
            -v "$PWD/usb/tests:/t" -v "$PWD/usb/config:/c" \
            debian:trixie sh /t/validate-fixes.sh

      - name: print + editors
        run: |
          docker run --rm --privileged \
            -v "$PWD/usb/tests:/t" -v "$PWD/usb/config:/c" \
            debian:trixie sh /t/validate-print.sh

      - name: status script (every branch, degraded box)
        run: |
          docker run --rm \
            -v "$PWD/usb/tests:/t" -v "$PWD/usb/config:/c" \
            debian:trixie sh /t/validate-status.sh

      # Network-dependent: tor bootstrap from a CI runner is usually fine but
      # not guaranteed - a flake here must not fail the kit.
      - name: clock over tor (network-dependent)
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD/usb/tests:/t" -v "$PWD/usb/config:/c" \
            debian:trixie bash /t/validate-clock.sh
