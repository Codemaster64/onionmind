name: Desktop tests

# The Windows job in desktop-build.yml runs these suites too; this covers the
# platforms the installers support beyond Windows, headless (Qt offscreen).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the app's dependencies
        run: python -m pip install "requests>=2.32,<3" "PySocks>=1.7,<2" "PySide6-Essentials>=6.11,<6.12" "textual>=1,<9"

      - name: Generated payloads are current
        run: python build.py --check

      - name: unittest suites
        shell: bash
        run: |
          failed=()
          for suite in tests/test_coding_agent.py tests/test_privacy_contracts.py \
                       tests/test_desktop_core.py tests/test_installer_contracts.py \
                       tests/test_release_version_contracts.py tests/test_desktop_ui.py \
                       tests/test_desktop_thinking_ui.py tests/test_desktop_tor_ui.py \
                       tests/test_desktop_v2_ui.py; do
            echo "::group::$suite"
            python -m unittest "$suite" || failed+=("$suite")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "Failed: ${failed[*]}"; exit 1; fi

      - name: Script suites (parser, backends, terminal UI)
        shell: bash
        run: |
          python tests/test_parser.py
          python tests/test_backends.py
          python tests/test_tui.py

      - name: The universal installer's sh half parses and dry-runs
        shell: bash
        run: |
          sh -n onionmind-install.cmd
          printf 'q\n' | sh onionmind-install.cmd --dry-run
