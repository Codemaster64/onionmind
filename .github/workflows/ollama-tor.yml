name: Ollama Tor plugin

on:
  push:
    paths:
      - "ollama-tor/**"
      - ".github/workflows/ollama-tor.yml"
  pull_request:
    paths:
      - "ollama-tor/**"
      - ".github/workflows/ollama-tor.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    defaults:
      run:
        working-directory: ollama-tor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build tools
        run: python -m pip install -e ".[test]"
      - name: Run offline test suite
        run: python -m pytest
      - name: Build standalone distributions
        run: python -m build
