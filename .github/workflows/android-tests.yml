name: android tests

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin:
    name: Kotlin suites and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run Kotlin test suites
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
